<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>妞妞家庭小游戏</title>
    <style>
:root {
  color-scheme: light;
  --bg: #f7f5ef;
  --surface: #ffffff;
  --ink: #20231f;
  --muted: #666b64;
  --line: #d9ddd5;
  --green: #2f6b4f;
  --green-soft: #e4f0e8;
  --coral: #c85d4c;
  --coral-soft: #f7e5df;
  --yellow: #f1c35a;
  --yellow-soft: #fff4cf;
  --focus: #155d91;
  --danger: #a83a31;
  --shadow: 0 8px 24px rgba(36, 45, 38, 0.1);
  font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  font-size: 17px;
}

* { box-sizing: border-box; }

html { background: var(--bg); }

body {
  margin: 0;
  min-width: 320px;
  background: var(--bg);
  color: var(--ink);
  letter-spacing: 0;
}

button,
input,
textarea { font: inherit; letter-spacing: 0; }

button { -webkit-tap-highlight-color: transparent; }

button:focus-visible,
input:focus-visible,
textarea:focus-visible {
  outline: 3px solid rgba(21, 93, 145, 0.32);
  outline-offset: 2px;
}

.app-shell {
  width: min(100%, 720px);
  min-height: 100vh;
  margin: 0 auto;
  background: var(--surface);
  padding-bottom: calc(84px + env(safe-area-inset-bottom));
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: calc(18px + env(safe-area-inset-top)) 18px 14px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}

.week-label,
.section-heading p,
.page-heading > p {
  margin: 0 0 3px;
  color: var(--green);
  font-size: 0.78rem;
  font-weight: 700;
}

h1, h2, h3, p { letter-spacing: 0; }

h1 { margin: 0; font-size: 1.28rem; line-height: 1.25; }
h2 { margin: 0; font-size: 1.25rem; line-height: 1.35; }
h3 { margin: 0; font-size: 1.06rem; line-height: 1.4; }

.icon-button {
  display: inline-grid;
  width: 46px;
  height: 46px;
  flex: 0 0 46px;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
}

.icon-button svg { width: 24px; height: 24px; }

.view { display: none; }
.view.active { display: block; }

.safety-banner {
  display: grid;
  grid-template-columns: 25px auto 1fr;
  align-items: center;
  gap: 8px;
  min-height: 54px;
  padding: 10px 18px;
  background: var(--yellow-soft);
  border-bottom: 1px solid #edd58a;
  color: #4c401f;
}

.safety-banner svg { width: 23px; color: var(--green); }
.safety-banner strong { white-space: nowrap; }
.safety-banner span { font-size: 0.88rem; line-height: 1.45; }

.hero-media {
  width: 100%;
  height: clamp(220px, 47vw, 320px);
  overflow: hidden;
  background: #edf0e8;
}

.hero-media img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  object-position: center 58%;
}

.day-picker-wrap,
.materials-section,
.steps-section,
.plain-section,
.saved-section { padding: 22px 18px; }

.day-picker-wrap,
.materials-section,
.steps-section,
.saved-section { border-bottom: 1px solid var(--line); }

.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 14px;
}

.section-heading.compact { margin-bottom: 12px; }

.quiet-status {
  color: var(--muted);
  font-size: 0.84rem;
  white-space: nowrap;
}

.segmented {
  display: grid;
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
  background: #f5f6f3;
}

.segmented button {
  min-width: 0;
  min-height: 46px;
  padding: 8px 6px;
  border: 0;
  border-right: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  font-weight: 700;
  cursor: pointer;
}

.segmented button:last-child { border-right: 0; }
.segmented button.active { background: var(--green); color: #fff; }

.day-picker { grid-template-columns: repeat(5, 1fr); }
.day-picker button { line-height: 1.2; font-size: 0.82rem; }
.day-picker button span { display: block; font-size: 0.72rem; font-weight: 500; margin-top: 3px; }

.day-summary {
  padding: 20px 18px;
  background: var(--green-soft);
  border-bottom: 1px solid #c4d9cb;
}

.day-summary-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
}

.day-summary h2 { font-size: 1.38rem; }
.day-summary p { margin: 8px 0 0; color: #3f5548; line-height: 1.62; }

.day-mark {
  display: grid;
  width: 52px;
  height: 52px;
  flex: 0 0 52px;
  place-items: center;
  border-radius: 50%;
  background: var(--surface);
  color: var(--green);
  font-weight: 800;
  border: 2px solid #b7d1c0;
}

.focus-note {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-top: 14px;
  padding-top: 13px;
  border-top: 1px solid #bfd3c5;
  color: #334a3b;
  font-weight: 700;
}

.focus-note svg { width: 21px; flex: 0 0 21px; }

.check-list { display: grid; gap: 9px; }

.check-item {
  display: grid;
  grid-template-columns: 28px 1fr;
  align-items: center;
  gap: 10px;
  min-height: 50px;
  padding: 8px 0;
  border-bottom: 1px dashed var(--line);
  cursor: pointer;
}

.check-item:last-child { border-bottom: 0; }
.check-item input { width: 23px; height: 23px; accent-color: var(--green); }
.check-item.checked span { color: var(--muted); text-decoration: line-through; }

.steps-preview { display: grid; gap: 14px; padding-top: 4px; }

.step-preview {
  display: grid;
  grid-template-columns: 112px minmax(0, 1fr);
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #fff;
}

.step-visual,
.session-step-visual {
  background-image: var(--step-image);
  background-position: var(--step-position) center;
  background-repeat: no-repeat;
  background-size: 500% 100%;
}

.step-visual {
  width: 100%;
  aspect-ratio: 3 / 5;
  border-right: 1px solid var(--line);
}

.step-preview-body {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr);
  align-content: center;
  align-items: start;
  gap: 6px 9px;
  min-height: 72px;
  padding: 12px 10px;
}

.step-number {
  display: grid;
  width: 44px;
  height: 44px;
  place-items: center;
  border-radius: 6px;
  background: var(--coral-soft);
  color: var(--coral);
  font-size: 1.05rem;
  font-weight: 800;
}

.step-preview-body .step-number {
  grid-row: 1 / span 2;
  width: 38px;
  height: 38px;
}

.step-preview strong { display: block; line-height: 1.35; }
.step-preview p { margin: 4px 0 0; color: var(--muted); font-size: 0.84rem; line-height: 1.45; }
.step-minutes { grid-column: 2; color: var(--green); font-weight: 800; white-space: nowrap; }

.camera-strip,
.rest-day-band,
.hearing-note {
  display: grid;
  grid-template-columns: 30px 1fr;
  gap: 12px;
  margin: 20px 18px;
  padding: 16px;
  border: 1px solid #dfc970;
  border-radius: 6px;
  background: var(--yellow-soft);
}

.camera-strip svg,
.rest-day-band svg,
.hearing-note svg { width: 26px; color: var(--green); }
.camera-strip p,
.rest-day-band p,
.hearing-note p { margin: 5px 0 0; color: #5c5338; font-size: 0.88rem; line-height: 1.55; }

.primary-action {
  display: flex;
  width: calc(100% - 36px);
  min-height: 58px;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin: 20px 18px 28px;
  padding: 12px 18px;
  border: 0;
  border-radius: 6px;
  background: var(--coral);
  color: #fff;
  font-size: 1.05rem;
  font-weight: 800;
  box-shadow: 0 5px 0 #984739;
  cursor: pointer;
}

.primary-action:active { transform: translateY(2px); box-shadow: 0 3px 0 #984739; }
.primary-action svg { width: 23px; }

.page-heading {
  padding: 24px 18px 20px;
  border-bottom: 1px solid var(--line);
}

.page-heading h2 { font-size: 1.5rem; }
.page-heading span { display: block; margin-top: 8px; color: var(--muted); line-height: 1.55; }

.week-plan { padding: 4px 18px 14px; }

.week-item {
  display: grid;
  grid-template-columns: 54px 1fr 28px;
  align-items: center;
  gap: 12px;
  min-height: 84px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
}

.week-item .day-mark { width: 48px; height: 48px; font-size: 0.88rem; }
.week-item h3 { font-size: 1rem; }
.week-item p { margin: 5px 0 0; color: var(--muted); font-size: 0.84rem; line-height: 1.45; }
.week-item svg { color: var(--muted); width: 22px; }
.week-item.complete .day-mark { background: var(--green); color: #fff; border-color: var(--green); }

.record-form { padding: 10px 18px 16px; }

.record-form label,
.record-form fieldset {
  display: block;
  margin: 0;
  padding: 17px 0;
  border: 0;
  border-bottom: 1px solid var(--line);
}

.record-form label > span,
.record-form legend {
  display: block;
  width: 100%;
  margin-bottom: 10px;
  color: var(--ink);
  font-weight: 800;
}

.field-row { display: grid !important; grid-template-columns: auto 1fr; align-items: center; gap: 16px; }
.field-row > span { margin: 0 !important; }

.record-form input,
.record-form textarea {
  width: 100%;
  border: 1px solid #bfc4bd;
  border-radius: 5px;
  background: #fff;
  color: var(--ink);
}

.record-form input { min-height: 48px; padding: 8px 12px; }
.record-form textarea { min-height: 82px; padding: 12px; resize: vertical; line-height: 1.5; }
.record-form .primary-action { width: 100%; margin: 22px 0 8px; }

.record-days { grid-template-columns: repeat(5, 1fr); }
.three-options { grid-template-columns: repeat(3, 1fr); }
.two-options { grid-template-columns: repeat(2, 1fr); }
.four-options { grid-template-columns: repeat(4, 1fr); }
.four-options button { font-size: 0.86rem; }

.records-list { display: grid; gap: 12px; }

.record-card {
  padding: 15px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #fff;
}

.record-card-head { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.record-card-head strong { color: var(--green); }
.record-card dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; margin: 14px 0; font-size: 0.88rem; line-height: 1.45; }
.record-card dt { color: var(--muted); }
.record-card dd { margin: 0; }
.record-actions { display: grid; grid-template-columns: 1fr 48px; gap: 9px; }

.copy-action,
.delete-action {
  min-height: 48px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: #f5f6f3;
  color: var(--ink);
  font-weight: 700;
  cursor: pointer;
}

.copy-action { display: flex; align-items: center; justify-content: center; gap: 8px; }
.delete-action { display: grid; place-items: center; color: var(--danger); }
.copy-action svg, .delete-action svg { width: 20px; }

.empty-state { padding: 22px 0; color: var(--muted); text-align: center; }

.stop-list { padding: 12px 18px 6px; }
.stop-list div { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: center; min-height: 60px; border-bottom: 1px solid var(--line); }
.stop-list svg { width: 23px; color: var(--danger); }

.plain-section h3 { margin-bottom: 14px; }
.avoid-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
.avoid-grid span { padding: 12px; border: 1px solid #e5b5af; border-radius: 5px; background: #fff4f2; color: #78332c; text-align: center; font-weight: 700; }
.hearing-note { border-color: #b8cfbf; background: var(--green-soft); }
.hearing-note p { color: #3f5548; }

.bottom-nav {
  position: fixed;
  z-index: 20;
  bottom: 0;
  left: 50%;
  display: grid;
  width: min(100%, 720px);
  grid-template-columns: repeat(4, 1fr);
  transform: translateX(-50%);
  padding: 7px 8px calc(7px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.98);
}

.bottom-nav button {
  display: grid;
  min-width: 0;
  min-height: 58px;
  place-items: center;
  align-content: center;
  gap: 3px;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 0.72rem;
  cursor: pointer;
}

.bottom-nav button svg { width: 23px; height: 23px; }
.bottom-nav button.active { color: var(--green); font-weight: 800; }

.session-dialog {
  width: min(100%, 720px);
  max-width: none;
  height: 100dvh;
  max-height: none;
  margin: 0 auto;
  padding: 0;
  border: 0;
  background: var(--bg);
  color: var(--ink);
}

.session-dialog::backdrop { background: rgba(18, 25, 20, 0.62); }

.session-topbar {
  display: grid;
  grid-template-columns: 46px 1fr 46px;
  align-items: center;
  gap: 10px;
  padding: calc(12px + env(safe-area-inset-top)) 14px 10px;
  background: #fff;
  border-bottom: 1px solid var(--line);
}

.session-topbar > div { text-align: center; }
.session-topbar span { display: block; color: var(--green); font-size: 0.76rem; font-weight: 800; }
.session-topbar strong { display: block; margin-top: 2px; font-size: 0.9rem; }

.session-progress { height: 7px; background: #dfe4dd; }
.session-progress span { display: block; width: 20%; height: 100%; background: var(--coral); transition: width 180ms ease; }

.session-content {
  display: flex;
  min-height: calc(100dvh - 82px);
  flex-direction: column;
  align-items: center;
  padding: 22px 18px calc(22px + env(safe-area-inset-bottom));
  text-align: center;
}

.session-step-visual {
  width: min(46vw, 200px);
  aspect-ratio: 3 / 5;
  margin-bottom: 14px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background-color: #f4f1e8;
}

.step-icon-large {
  display: grid;
  width: 76px;
  height: 76px;
  place-items: center;
  border: 2px solid #c5d8ca;
  border-radius: 50%;
  background: var(--green-soft);
  color: var(--green);
}

.step-icon-large svg { width: 36px; height: 36px; }
.step-time-label { margin: 12px 0 4px; color: var(--coral); font-size: 0.88rem; font-weight: 800; }
.session-content h2 { font-size: 1.75rem; }
.step-action { max-width: 560px; margin: 10px 0 18px; color: #3e433e; font-size: 1.05rem; line-height: 1.65; }

.say-box,
.watch-box {
  width: 100%;
  max-width: 590px;
  padding: 14px 16px;
  border-left: 5px solid var(--coral);
  background: var(--coral-soft);
  text-align: left;
}

.watch-box { margin-top: 10px; border-left-color: var(--green); background: var(--green-soft); }
.say-box span, .watch-box span { color: var(--muted); font-size: 0.75rem; font-weight: 800; }
.say-box p, .watch-box p { margin: 5px 0 0; font-weight: 700; line-height: 1.55; }

.timer-display {
  margin: auto 0 14px;
  padding-top: 20px;
  font-variant-numeric: tabular-nums;
  font-size: 2.75rem;
  font-weight: 800;
  line-height: 1;
}

.timer-controls {
  display: grid;
  width: 100%;
  max-width: 590px;
  grid-template-columns: minmax(78px, 1fr) minmax(128px, 1.4fr) minmax(78px, 1fr);
  gap: 8px;
}

.secondary-action,
.timer-action {
  display: flex;
  min-width: 0;
  min-height: 56px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 8px;
  border-radius: 6px;
  font-weight: 800;
  cursor: pointer;
}

.secondary-action { border: 1px solid var(--line); background: #fff; color: var(--ink); }
.timer-action { border: 0; background: var(--coral); color: #fff; }
.secondary-action:disabled { opacity: 0.4; cursor: default; }
.secondary-action svg, .timer-action svg { width: 21px; flex: 0 0 21px; }

.toast {
  position: fixed;
  z-index: 50;
  left: 50%;
  bottom: calc(94px + env(safe-area-inset-bottom));
  width: max-content;
  max-width: calc(100% - 40px);
  transform: translate(-50%, 14px);
  padding: 11px 15px;
  border-radius: 5px;
  background: #20231f;
  color: #fff;
  opacity: 0;
  pointer-events: none;
  transition: 160ms ease;
  font-size: 0.88rem;
}

.toast.show { opacity: 1; transform: translate(-50%, 0); }

body.large-text { font-size: 20px; }
body.large-text .bottom-nav button { font-size: 0.72rem; }
body.large-text .day-picker button { font-size: 0.8rem; }

@media (min-width: 721px) {
  body { padding: 24px 0; }
  .app-shell { min-height: calc(100vh - 48px); box-shadow: var(--shadow); }
  .bottom-nav { bottom: 24px; }
  .session-dialog { height: calc(100dvh - 48px); margin: 24px auto; }
  .session-content { min-height: calc(100dvh - 130px); }
}

@media (max-width: 380px) {
  :root { font-size: 16px; }
  .topbar { padding-left: 14px; padding-right: 14px; }
  .day-picker-wrap, .materials-section, .steps-section, .plain-section, .saved-section { padding-left: 14px; padding-right: 14px; }
  .safety-banner { grid-template-columns: 24px 1fr; }
  .safety-banner span { grid-column: 2; }
  .session-content { padding-left: 14px; padding-right: 14px; }
  .timer-controls { grid-template-columns: 1fr 1.25fr 1fr; }
  .secondary-action span { font-size: 0.78rem; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
}

</style>

          <div class="day-picker-wrap">
            <div class="section-heading compact">
              <div>
                <p>选择训练日</p>
                <h2 id="todayTitle">今天玩哪一组</h2>
              </div>
              <span id="completionCount" class="quiet-status">0/5次</span>
            </div>
            <div id="dayPicker" class="segmented day-picker" role="tablist" aria-label="选择训练日"></div>
          </div>

          <section id="daySummary" class="day-summary"></section>

          <section class="materials-section" aria-labelledby="materialsTitle">
            <div class="section-heading">
              <div>
                <p>开始前摆好</p>
                <h2 id="materialsTitle">今天需要的东西</h2>
              </div>
              <button id="readMaterials" class="icon-button" type="button" aria-label="朗读材料清单" title="朗读材料清单">
                <i data-lucide="volume-2"></i>
              </button>
            </div>
            <div id="materialsList" class="check-list"></div>
          </section>

          <section class="steps-section" aria-labelledby="stepsTitle">
            <div class="section-heading">
              <div>
                <p>共15分钟</p>
                <h2 id="stepsTitle">照着顺序做</h2>
              </div>
            </div>
            <div id="stepsPreview" class="steps-preview"></div>
          </section>

          <section class="camera-strip">
            <i data-lucide="video"></i>
            <div>
              <strong>手机竖着固定，离孩子约3米</strong>
              <p>拍到全身和地面即可，不用让孩子对镜头表演。</p>
            </div>
          </section>

          <button id="startSession" class="primary-action" type="button">
            <i data-lucide="play"></i>
            开始15分钟跟练
          </button>
        </section>

        <section id="weekView" class="view" aria-labelledby="weekTitle">
          <div class="page-heading">
            <p>第一阶段 · 7天</p>
            <h2 id="weekTitle">一周安排</h2>
            <span>做5次，另外2天只安排户外和自由游戏。</span>
          </div>
          <div id="weekPlan" class="week-plan"></div>
          <div class="rest-day-band">
            <i data-lucide="trees"></i>
            <div>
              <strong>第4天、第6天</strong>
              <p>不做结构化练习。正常户外活动、自由游戏和亲子共读。</p>
            </div>
          </div>
        </section>

        <section id="recordView" class="view" aria-labelledby="recordTitle">
          <div class="page-heading">
            <p>做完马上记</p>
            <h2 id="recordTitle">观察记录</h2>
            <span>只记录事实，不给孩子打分。</span>
          </div>

          <form id="recordForm" class="record-form">
            <label class="field-row">
              <span>日期</span>
              <input id="recordDate" type="date" required />
            </label>

            <fieldset>
              <legend>今天做的是</legend>
              <div id="recordDayPicker" class="segmented record-days"></div>
            </fieldset>

            <fieldset>
              <legend>睡眠和精神</legend>
              <div class="segmented three-options" data-field="energy">
                <button type="button" data-value="好">好</button>
                <button type="button" data-value="一般">一般</button>
                <button type="button" data-value="差">差</button>
              </div>
            </fieldset>

            <fieldset>
              <legend>怎么开始参加的</legend>
              <div class="segmented three-options" data-field="participation">
                <button type="button" data-value="主动参加">主动</button>
                <button type="button" data-value="提醒后参加">提醒后</button>
                <button type="button" data-value="拒绝">拒绝</button>
              </div>
            </fieldset>

            <fieldset>
              <legend>完成任务需要提示</legend>
              <div class="segmented three-options" data-field="prompts">
                <button type="button" data-value="0次">0次</button>
                <button type="button" data-value="1-2次">1—2次</button>
                <button type="button" data-value="3次以上">3次以上</button>
              </div>
            </fieldset>

            <label>
              <span>最顺利的动作</span>
              <textarea id="bestAction" rows="2" placeholder="例如：自己推完两趟洗衣篮"></textarea>
            </label>

            <label>
              <span>最困难的动作</span>
              <textarea id="hardAction" rows="2" placeholder="例如：走胶带线时总踩到外面"></textarea>
            </label>

            <fieldset>
              <legend>孩子还想再玩吗</legend>
              <div class="segmented two-options" data-field="again">
                <button type="button" data-value="想">想</button>
                <button type="button" data-value="不想">不想</button>
              </div>
            </fieldset>

            <fieldset>
              <legend>结束后的状态</legend>
              <div class="segmented four-options" data-field="afterState">
                <button type="button" data-value="平静">平静</button>
                <button type="button" data-value="兴奋">兴奋</button>
                <button type="button" data-value="烦躁">烦躁</button>
                <button type="button" data-value="疲劳">疲劳</button>
              </div>
            </fieldset>

            <label>
              <span>家长想确认的问题</span>
              <textarea id="parentQuestion" rows="3" placeholder="例如：投球总用一只手，需要调整吗？"></textarea>
            </label>

            <button class="primary-action" type="submit">
              <i data-lucide="save"></i>
              保存这次记录
            </button>
          </form>

          <section class="saved-section" aria-labelledby="savedTitle">
            <div class="section-heading">
              <div>
                <p>保存在这台手机</p>
                <h2 id="savedTitle">已有记录</h2>
              </div>
            </div>
            <div id="recordsList" class="records-list"></div>
          </section>
        </section>

        <section id="safetyView" class="view" aria-labelledby="safetyTitle">
          <div class="page-heading">
            <p>先安全，再训练</p>
            <h2 id="safetyTitle">这些情况马上停</h2>
            <span>家庭游戏不能代替儿童保健、听力筛查或专业评估。</span>
          </div>

          <div class="stop-list">
            <div><i data-lucide="circle-stop"></i><span>脸色发白、头晕、恶心或疼痛</span></div>
            <div><i data-lucide="circle-stop"></i><span>连续摔倒，和平时明显不同</span></div>
            <div><i data-lucide="circle-stop"></i><span>哭闹、逃开或明确说不玩</span></div>
            <div><i data-lucide="circle-stop"></i><span>活动后异常兴奋、疲倦或很久不能平静</span></div>
          </div>

          <section class="plain-section">
            <h3>第一阶段不要做</h3>
            <div class="avoid-grid">
              <span>强烈旋转</span>
              <span>倒挂悬吊</span>
              <span>高处跳跃</span>
              <span>触觉刷</span>
              <span>负重背心</span>
              <span>听觉训练方案</span>
            </div>
          </section>

          <section class="hearing-note">
            <i data-lucide="ear"></i>
            <div>
              <h3>关于听觉反应</h3>
              <p>不要在背后突然叫孩子来“测试”。如果在日常多个环境中经常听不到名字、声音或熟悉指令，或者出现语言倒退，应安排儿童保健和正规听力筛查。</p>
            </div>
          </section>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="页面导航">
        <button class="active" type="button" data-view="todayView">

        <button type="button" data-view="weekView">
          <i data-lucide="calendar-days"></i><span>周计划</span>
        </button>
        <button type="button" data-view="recordView">
          <i data-lucide="clipboard-pen-line"></i><span>记录</span>
        </button>
        <button type="button" data-view="safetyView">
          <i data-lucide="shield-alert"></i><span>安全</span>
        </button>
      </nav>
    </div>

    <dialog id="sessionDialog" class="session-dialog">
      <div class="session-topbar">
        <button id="closeSession" class="icon-button" type="button" aria-label="退出跟练" title="退出跟练">
          <i data-lucide="x"></i>
        </button>
        <div>
          <span id="sessionDayLabel">第1天</span>

        <button id="readStep" class="icon-button" type="button" aria-label="朗读当前步骤" title="朗读当前步骤">
          <i data-lucide="volume-2"></i>
        </button>
      </div>

      <div class="session-progress"><span id="sessionProgressBar"></span></div>

      <div class="session-content">

            <i data-lucide="play"></i><span>开始计时</span>
          </button>
          <button id="nextStep" class="secondary-action" type="button">
            <span>下一步</span><i data-lucide="chevron-right"></i>
          </button>
        </div>
      </div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
